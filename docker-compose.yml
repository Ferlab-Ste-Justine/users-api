version: '3.9'

services:
  app: 
    build: .
    depends_on: 
      - db
    ports:
      - "1212:1212"
    environment:
      PGUSER: postgres
      PGPASSWORD: password 
      PGPORT: 5432
      PGHOST: db 
      PGDATABASE: users
  db:
    # Pinned: migration 1688561786592 indexes on a function selecting from an unqualified
    # "pgmigrations", and PG 15+ runs CREATE INDEX with a secure search_path, so it no longer
    # resolves. Unpinned, this tracked latest and could not build the schema from scratch.
    image: postgres:14
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: users
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
